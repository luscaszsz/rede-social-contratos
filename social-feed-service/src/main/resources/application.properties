quarkus.smallrye-openapi.info-title=API de feed rede social
quarkus.smallrye-openapi.info-version=1.0.0


quarkus.http.port=8080
quarkus.http.test-port=0

# Aula 4: limite de publicações de um usuário para o mesmo contrato.
# Pode ser sobrescrito com FEED_PUBLICACOES_LIMITE_POR_CONTRATO.
feed.publicacoes.limite-por-contrato=3

#aula 3
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:feed;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true


%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:feed-test;DB_CLOSE_DELAY=-1
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.rest-client.contracts.url=http://localhost:8081

# Aula 5: os valores podem ser sobrescritos sem recompilar.
org.caixa.service.GatewayContratos/listarDisponiveis/Timeout/value=2000
org.caixa.service.GatewayContratos/listarDisponiveis/Retry/maxRetries=2
org.caixa.service.GatewayContratos/listarDisponiveis/CircuitBreaker/requestVolumeThreshold=4
org.caixa.service.GatewayContratos/confirmar/Timeout/value=2000
org.caixa.service.GatewayContratos/confirmar/Retry/maxRetries=2
org.caixa.service.GatewayContratos/confirmar/CircuitBreaker/requestVolumeThreshold=4


quarkus.http.auth.basic=true
#quarkus.security.users.embedded.enabled=true
#quarkus.security.users.embedded.plain-text=true
#quarkus.security.users.embedded.users.user=user123
#quarkus.security.users.embedded.roles.user=USER


quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.metrics.paths=/q/metrics,/q/metrics/*
quarkus.http.auth.permission.metrics.policy=permit
