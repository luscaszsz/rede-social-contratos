# Aula 2: t√≠tulo da documenta√ß√£o OpenAPI. A Swagger UI fica em /q/swagger-ui (dev e test).
quarkus.smallrye-openapi.info-title=API de Chaves PIX
quarkus.smallrye-openapi.info-version=1.0.0

# Aula 3: H2 em mem√≥ria. Sem Docker na rede, os Dev Services (banco em cont√™iner) ficam desligados.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:chaves;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
# Dados de exemplo: sem quarkus.hibernate-orm.sql-load-script, o Quarkus carrega o import.sql s√≥ em dev e test;
# no jar (perfil prod), n√£o carrega nada.

# Aula 4: configura√ß√£o do dom√≠nio, lida por PixConfig (@ConfigMapping).
# Regra do DICT para pessoa f√≠sica: at√© 5 chaves por conta.
# Pode ser sobrescrita sem recompilar: vari√°vel PIX_CHAVES_LIMITE_POR_CONTA ou -Dpix.chaves.limite-por-conta.
pix.chaves.limite-por-conta=5

# Aula 4: perfis. Sem prefixo = vale em todos; %dev = quarkus:dev; %test = @QuarkusTest; %prod = jar empacotado.
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:chaves-test;DB_CLOSE_DELAY=-1

# Aula 5: servi√ßo de contas (m√≥dulo contas, porta 8081).
quarkus.rest-client.contas.url=http://localhost:8081
# Nos testes, porta aleat√≥ria: assim o teste n√£o colide com o contas aberto em quarkus:dev na 8081.
quarkus.http.test-port=0

# Aula 5: Fault Tolerance por configura√ß√£o (<classe>/<m√©todo>/<anota√ß√£o>/<par√¢metro>).
# Valores did√°ticos, iguais aos das anota√ß√µes: em produ√ß√£o, saem de medi√ß√£o (lat√™ncia p99, taxa de erro).
tech.ada.pix.chaves.ContasGateway/confirmarConta/Timeout/value=500
tech.ada.pix.chaves.ContasGateway/confirmarConta/Retry/maxRetries=2
tech.ada.pix.chaves.ContasGateway/confirmarConta/CircuitBreaker/requestVolumeThreshold=4


# aula 7 - definindo autenticaÁ„o com basic

quarkus.http.auth.basic=true


# Aula 8: autorizaÁ„o por configuraÁ„o para os caminhos que n„o s„o recursos JAX-RS (/q/*).
# Health aberto (o orquestrador n„o tem usu·rio); mÈtricas sÛ para auditor; documentaÁ„o para quem tem login.
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.policy.somente-auditor.roles-allowed=auditor
quarkus.http.auth.permission.metricas.paths=/q/metrics,/q/metrics/*
quarkus.http.auth.permission.metricas.policy=somente-auditor
quarkus.http.auth.permission.documentacao.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.documentacao.policy=authenticated


# Aula 8: CORS para um front-end de exemplo em outra origem. properties
