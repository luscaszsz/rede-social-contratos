quarkus.http.port=8081
quarkus.http.test-port=0
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:contracts;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:contracts-test;DB_CLOSE_DELAY=-1
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.user=user123
quarkus.security.users.embedded.roles.user=USER
